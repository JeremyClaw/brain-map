<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeremy Brain Map</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1f2340 0%, #0e1020 55%, #090b15 100%);
    color: #eef2ff;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .title {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 2;
  }
  .title h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  .title p { margin: 4px 0 0; font-size: 12px; color: #a8b3d8; }
  .legend {
    position: absolute; left: 18px; bottom: 18px; background: rgba(12,14,28,0.86);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px;
    backdrop-filter: blur(10px); font-size: 12px; z-index: 2;
  }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .help {
    position: absolute; right: 18px; bottom: 18px; background: rgba(12,14,28,0.86);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px;
    backdrop-filter: blur(10px); font-size: 12px; color: #b7c0de; z-index: 2;
  }
  .toolbar {
    position: absolute; top: 18px; left: 18px; display: flex; gap: 10px; z-index: 2;
  }
  button {
    background: rgba(12,14,28,0.86); color: #eef2ff; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 600;
  }
  .panel {
    position: absolute; right: 18px; top: 80px; width: 420px; max-width: calc(100vw - 36px); max-height: calc(100vh - 110px);
    overflow: auto; background: rgba(10,12,24,0.96); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); padding: 18px; display: none; z-index: 3;
  }
  .panel.open { display: block; }
  .panel h2 { margin: 0 0 6px; font-size: 22px; }
  .muted { color: #9fb0dc; font-size: 12px; }
  .section { margin-top: 16px; }
  .section h3 { margin: 0 0 8px; font-size: 13px; color: #c8d3f4; text-transform: uppercase; letter-spacing: 0.08em; }
  .chip { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); margin: 4px 6px 0 0; font-size: 12px; }
  ul { margin: 8px 0 0 18px; padding: 0; }
  li { margin: 6px 0; line-height: 1.45; }
  .close { float: right; font-size: 20px; line-height: 1; background: none; border: none; padding: 0; color: #a8b3d8; }
  .small { font-size: 13px; line-height: 1.55; color: #dde5ff; }
</style>
</head>
<body>
<div id="wrap">
  <div class="toolbar">
    <button id="btnOverview">Archive overview</button>
  </div>
  <div class="title">
    <h1>🧠 Jeremy Brain Map</h1>
    <p>Click a node to inspect it properly · vault expanded</p>
  </div>
  <canvas id="c"></canvas>
  <div class="legend">
    <div><span class="dot" style="background:#ff6b6b"></span>People</div>
    <div><span class="dot" style="background:#4ecdc4"></span>Clients</div>
    <div><span class="dot" style="background:#ffe66d"></span>Projects</div>
    <div><span class="dot" style="background:#a29bfe"></span>Workflows</div>
    <div><span class="dot" style="background:#fd79a8"></span>Infrastructure</div>
    <div><span class="dot" style="background:#74b9ff"></span>Decisions</div>
  </div>
  <div class="help">Hover for quick glance. Click for deeper node detail. Drag nodes around if you want.</div>
  <div class="panel" id="panel"></div>
</div>
<script>
const archiveOverview = {
  total: 2365,
  status: { safe: 2249, sensitive: 51, exclude: 52, mixed_work: 13 },
  buckets: { archive_misc: 1335, clients_brands: 441, sales_career: 182, copy_creative: 164, projects_workflows: 133, health_allowed: 58 }
};
const nodeDetails = {
  deej: { title:'Deej', type:'Person', source:'Direct conversations + profile context', summary:'Dylan “Deej” Burke. Owner. Cape Town. Media buyer. Central node tying together clients, projects, systems, and decision-making.', bullets:['Owner of this whole circus','Works across DTC brands and creative/media systems','Primary human context the brain is built around'], links:['Lauri','Athena','Nova','So Shell','Symbols on Silk','ThirstyBird'] },
  lauri: { title:'Lauri', type:'Person', source:'Confirmed by Deej, 2 Apr 2026', summary:'Deej’s sister. Connected to Symbols on Silk and First Light Couriers.', bullets:['Corrected spelling from earlier “Lori” ghost entry','Useful relationship node across family + client context'], links:['Deej','Symbols on Silk','FLC'] },
  symbols: { title:'Symbols on Silk', type:'Client', source:'Meta API pull + direct confirmation', summary:'Jewellery client with tracked Meta ad spend and linkage to both Athena and Nova systems.', bullets:['Meta Ad Account linked','Monthly spend imported (Nov–Mar)','Connected to Lauri and Deej'], links:['Athena','Nova','Lauri','Meta Ads API'] },
  soshell: { title:'So Shell', type:'Client', source:'Topic 35 creative thread', summary:'Primary proof-of-concept creative brand for Nova. Most developed workflow in the brain so far.', bullets:['Ethical jewellery / Cape Town artisan positioning','v7 creative round completed','Strongest documented workflow so far'], links:['Nova','So Shell Creative Workflow'] },
  pina: { title:'Pina Jewels', type:'Client', source:'Main session + direct confirmation', summary:'Client brand with DNA prepared in Nova, but not fully promoted into active creative system.', bullets:['Prepared separately','Not fully baked into Nova by default'], links:['Nova','Deej'] },
  gloei: { title:'Gloei Beauty', type:'Client', source:'Main session + direct confirmation', summary:'Beauty brand client with separate brand DNA prepared for future creative use.', bullets:['Prepared but not deeply expanded yet'], links:['Nova','Deej'] },
  flc: { title:'First Light Couriers', type:'Client', source:'Direct confirmation', summary:'Courier/logistics client node, currently lightweight but linked via Lauri.', bullets:['Relationship useful more than detailed ops memory currently'], links:['Lauri','Deej'] },
  athena: { title:'Athena', type:'Project', source:'18 Mar setup + Athena session', summary:'Media-buyer agent with Meta API access, ad analysis capacity, and client profile/workspace structure.', bullets:['Sonnet model','Meta Marketing API connected','Andromeda Bible + troubleshooting docs'], links:['Symbols on Silk','Meta Ads API','Model Usage'] },
  nova: { title:'Nova', type:'Project', source:'Main session', summary:'Creative agent/workspace. Not fully deployed as standalone operator yet, but has the strongest future potential for structured creative memory.', bullets:['Ad creation + creative research','Not prospecting','Learning loop every 2 days'], links:['So Shell','Pina Jewels','Gloei Beauty','Athena','Model Usage'] },
  spotlight: { title:'Spotlight', type:'Project', source:'18 Mar setup', summary:'“Impress [name]” workflow for building personalised landing pages.', bullets:['GitHub Pages deployment','Verification step required to avoid wrong-person builds'], links:['GitHub'] },
  thirsty: { title:'ThirstyBird', type:'Project', source:'Project memory', summary:'Marketing venture in progress. Currently a lighter node than Nova/So Shell.', bullets:['Plan sent','Still in progress'], links:['Deej'] },
  workflow: { title:'So Shell Creative Workflow', type:'Workflow', source:'Topic 35', summary:'The clearest reusable workflow in the current brain: from brief to render to review to revision loop.', bullets:['Brief → Images → Copy → Render → Upload → Review → Revise','Tracks rationale, not just outputs','Exactly the sort of thing a good brain should store'], links:['So Shell','Nova'] },
  setup: { title:'OpenClaw Setup', type:'Infrastructure', source:'18 Mar setup', summary:'Core host/runtime setup: Jarvis, Telegram groups, Chrome headless, Tailscale, and the operational environment.', bullets:['Host = Jarvis','Telegram + forum/topic support','Chrome headless used for rendering'], links:['GitHub','Meta Ads API'] },
  github: { title:'GitHub', type:'Infrastructure', source:'18 Mar setup', summary:'Publishing and repo layer. Currently used for brain-map site and Spotlight repo.', bullets:['JeremyClaw account','Brain map published via GitHub Pages'], links:['Spotlight','OpenClaw Setup'] },
  meta: { title:'Meta Ads API', type:'Infrastructure', source:'Athena architecture', summary:'System-user based access model for ad account retrieval without relying on Deej’s personal Facebook account.', bullets:['Keychain token storage','ads_read access','One identity → multiple accounts'], links:['Athena','Symbols on Silk'] },
  models: { title:'Model Usage', type:'Decision', source:'Standing rule', summary:'Cheapest viable model first. Core cost-control rule that should govern the whole system.', bullets:['GPT → Sonnet → Opus','Use the least expensive model that does the job properly'], links:['Athena','Nova'] },
  email: { title:'Email Format', type:'Decision', source:'Standing rule', summary:'Default email structure and sign-off pattern for outbound communication.', bullets:['Greeting → context → ask → optional closing → signature'], links:['Deej'] },
  memory: { title:'Memory Sourcing', type:'Decision', source:'Brain build decision', summary:'Anti-ghost-data rules. This exists because earlier memory had fabricated or unsourced entries.', bullets:['Every fact should have source discipline','No more hallucinated long-term memory'], links:['Deej','Brain Index'] },
  index: { title:'Brain Index', type:'Index Layer', source:'Built 3 Apr 2026', summary:'The lightweight entrypoint into the structured brain. Helps avoid loading everything all the time.', bullets:['Supports low-token retrieval design','Works with archive/search architecture'], links:['Memory Sourcing','Nova'] },
};
const colors = { people:'#ff6b6b', clients:'#4ecdc4', projects:'#ffe66d', workflows:'#a29bfe', infra:'#fd79a8', decisions:'#74b9ff' };
const nodes = [
  {id:'deej', label:'Deej', cat:'people', r:28},
  {id:'lauri', label:'Lauri', cat:'people', r:18},
  {id:'symbols', label:'Symbols on Silk', cat:'clients', r:24},
  {id:'soshell', label:'So Shell', cat:'clients', r:24},
  {id:'pina', label:'Pina Jewels', cat:'clients', r:18},
  {id:'gloei', label:'Gloei Beauty', cat:'clients', r:18},
  {id:'flc', label:'FLC', cat:'clients', r:16},
  {id:'athena', label:'Athena', cat:'projects', r:24},
  {id:'nova', label:'Nova', cat:'projects', r:24},
  {id:'spotlight', label:'Spotlight', cat:'projects', r:18},
  {id:'thirsty', label:'ThirstyBird', cat:'projects', r:16},
  {id:'workflow', label:'So Shell Creative Workflow', cat:'workflows', r:22},
  {id:'setup', label:'OpenClaw Setup', cat:'infra', r:18},
  {id:'github', label:'GitHub', cat:'infra', r:14},
  {id:'meta', label:'Meta Ads API', cat:'infra', r:18},
  {id:'models', label:'Model Usage', cat:'decisions', r:18},
  {id:'email', label:'Email Format', cat:'decisions', r:14},
  {id:'memory', label:'Memory Sourcing', cat:'decisions', r:18},
  {id:'index', label:'Brain Index', cat:'workflows', r:16}
];
const edges = [
  ['deej','lauri'], ['deej','symbols'], ['deej','soshell'], ['deej','pina'], ['deej','gloei'], ['deej','flc'], ['deej','athena'], ['deej','nova'], ['deej','thirsty'],
  ['lauri','symbols'], ['lauri','flc'],
  ['symbols','athena'], ['symbols','nova'], ['symbols','meta'],
  ['soshell','nova'], ['soshell','workflow'],
  ['pina','nova'], ['gloei','nova'],
  ['athena','meta'], ['athena','models'],
  ['nova','models'], ['nova','workflow'], ['nova','index'],
  ['spotlight','github'],
  ['setup','github'], ['setup','meta'],
  ['email','deej'], ['memory','deej'], ['memory','index']
];
const layout = {
  people: [0.30, 0.26], clients: [0.68, 0.28], projects: [0.26, 0.62], workflows: [0.55, 0.70], infra: [0.74, 0.64], decisions: [0.48, 0.48]
};
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
let hovered = null, drag = null, mouseX = 0, mouseY = 0;
function renderPanelHTML(title, body){
  panel.innerHTML = `<button class="close" onclick="closePanel()">×</button>${body}`;
  panel.classList.add('open');
}
function closePanel(){ panel.classList.remove('open'); }
window.closePanel = closePanel;
function openOverview(){
  const status = Object.entries(archiveOverview.status).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('');
  const buckets = Object.entries(archiveOverview.buckets).map(([k,v])=>`<li><strong>${k}</strong>: ${v}</li>`).join('');
  renderPanelHTML('Archive overview', `
    <h2>Archive overview</h2>
    <div class="muted">ChatGPT export indexing layer</div>
    <div class="section"><h3>Total conversations</h3><div class="small">${archiveOverview.total}</div></div>
    <div class="section"><h3>Status split</h3>${status}</div>
    <div class="section"><h3>Bucket counts</h3><ul>${buckets}</ul></div>
    <div class="section"><h3>What this means</h3><div class="small">The archive is now indexed separately from the active brain. That means raw old conversations do not need to be loaded every session. The brain can stay small while the archive remains searchable on demand.</div></div>
  `);
}
function openNode(id){
  const d = nodeDetails[id];
  const chips = (d.links||[]).map(x=>`<span class="chip">${x}</span>`).join('');
  const bullets = (d.bullets||[]).map(x=>`<li>${x}</li>`).join('');
  renderPanelHTML(d.title, `
    <h2>${d.title}</h2>
    <div class="muted">${d.type} · Source: ${d.source}</div>
    <div class="section"><h3>Summary</h3><div class="small">${d.summary}</div></div>
    <div class="section"><h3>Key points</h3><ul>${bullets}</ul></div>
    <div class="section"><h3>Linked nodes</h3>${chips}</div>
  `);
}
function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  if (!nodes[0].x) seed();
}
function seed() {
  nodes.forEach(n => {
    const [lx,ly] = layout[n.cat];
    n.x = window.innerWidth * lx + (Math.random()-0.5) * 160;
    n.y = window.innerHeight * ly + (Math.random()-0.5) * 120;
    n.vx = 0; n.vy = 0;
  });
}
function step() {
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
    const a = nodes[i], b = nodes[j];
    let dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 0.1, min = a.r + b.r + 36;
    if (d < min) { let f = (min-d) * 0.012; dx/=d; dy/=d; a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f; }
  }
  edges.forEach(([aId,bId]) => {
    const a = nodes.find(n=>n.id===aId), b = nodes.find(n=>n.id===bId);
    let dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 0.1, target = 150, f = (d-target) * 0.0018;
    dx/=d; dy/=d; a.vx += dx*f; a.vy += dy*f; b.vx -= dx*f; b.vy -= dy*f;
  });
  nodes.forEach(n => {
    if (drag === n) { n.x = mouseX; n.y = mouseY; n.vx = n.vy = 0; return; }
    const [lx,ly] = layout[n.cat];
    n.vx += (window.innerWidth*lx - n.x) * 0.0009;
    n.vy += (window.innerHeight*ly - n.y) * 0.0009;
    n.vx *= 0.92; n.vy *= 0.92;
    n.x += n.vx; n.y += n.vy;
  });
}
function connected(a,b) { return edges.some(([x,y]) => (x===a.id&&y===b.id)||(x===b.id&&y===a.id)); }
function draw() {
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  edges.forEach(([aId,bId]) => {
    const a = nodes.find(n=>n.id===aId), b = nodes.find(n=>n.id===bId);
    const active = hovered && (hovered.id===aId || hovered.id===bId);
    ctx.strokeStyle = active ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.10)';
    ctx.lineWidth = active ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  nodes.forEach(n => {
    const dim = hovered && hovered!==n && !connected(hovered,n);
    ctx.globalAlpha = dim ? 0.25 : 1;
    if (hovered===n) { ctx.shadowColor = colors[n.cat]; ctx.shadowBlur = 26; } else { ctx.shadowBlur = 0; }
    ctx.fillStyle = colors[n.cat]; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = n.cat === 'projects' ? '#202124' : '#ffffff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const size = n.r >= 22 ? 12 : 10; ctx.font = `600 ${size}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
    const words = n.label.split(' '); let lines=[];
    if (n.label.length > 12 && words.length > 1) { const mid = Math.ceil(words.length/2); lines=[words.slice(0,mid).join(' '), words.slice(mid).join(' ')]; }
    else { lines=[n.label]; }
    lines.forEach((line,i)=>ctx.fillText(line,n.x,n.y + (i-(lines.length-1)/2)*13));
    ctx.globalAlpha = 1;
  });
}
function tick(){ step(); draw(); requestAnimationFrame(tick); }
function pick(x,y){ return nodes.find(n => Math.hypot(x-n.x, y-n.y) <= n.r); }
canvas.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; if (!drag) hovered = pick(mouseX, mouseY) || null; canvas.style.cursor = hovered ? 'pointer' : 'default'; });
canvas.addEventListener('mousedown', e => { drag = pick(e.clientX, e.clientY); });
window.addEventListener('mouseup', e => { if (drag && Math.hypot(e.clientX-drag.x,e.clientY-drag.y) < 6) openNode(drag.id); drag = null; });
document.getElementById('btnOverview').addEventListener('click', openOverview);
window.addEventListener('resize', resize);
resize(); tick();
</script>
</body>
</html>
